
name: DigDown Client Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-67client:
    name: Build 67Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build 67Client
        working-directory: DigDownClient/67client/67client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload 67Client
        uses: actions/upload-artifact@v4
        with:
          name: DigDown-67Client
          path: DigDownClient/67client/67client/build/libs/*.jar
          if-no-files-found: error

  build-anubis:
    name: Build Anubis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Anubis
        working-directory: DigDownClient/Anubis/anubis-1.0-src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Anubis
        uses: actions/upload-artifact@v4
        with:
          name: DigDown-Anubis
          path: DigDownClient/Anubis/anubis-1.0-src/build/libs/*.jar
          if-no-files-found: error

